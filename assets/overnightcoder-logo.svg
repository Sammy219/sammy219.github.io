<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- OverNightCoder: <O> — huruf O dengan bayangan bulan sabit (malam) di antara kurung kode (coder), latar langit malam. -->
  <defs>
    <linearGradient id="code" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a84ff"/>
      <stop offset="1" stop-color="#22c4f5"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset="1" stop-color="#ffb86b"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17305e"/>
      <stop offset="1" stop-color="#090e1c"/>
    </linearGradient>
    <!-- Bayangan: lingkaran gelap digeser ke kiri-bawah menutup sebagian O, menyisakan sabit cahaya di kanan-atas. -->
    <mask id="crescent">
      <rect width="96" height="96" fill="#fff"/>
      <circle cx="41" cy="55" r="22" fill="#000"/>
    </mask>
  </defs>
  <rect width="96" height="96" rx="22" fill="url(#night)"/>
  <!-- huruf O: sisi dalam bayangan -->
  <circle cx="48" cy="48" r="17" fill="none" stroke="#223a6a" stroke-width="7"/>
  <!-- huruf O: sisi yang terkena cahaya bulan -->
  <circle cx="48" cy="48" r="17" fill="none" stroke="url(#moon)" stroke-width="7" mask="url(#crescent)"/>
  <!-- kurung kode < dan > -->
  <g fill="none" stroke="url(#code)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 34L10 48l14 14"/>
    <path d="M72 34l14 14-14 14"/>
  </g>
</svg>
