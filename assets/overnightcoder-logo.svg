<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- OverNightCoder: bulan sabit (malam) + tanda kode </> (coder), gradien biru OmoSync → hijau/oranye SystemMonitor di ubin navy -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a84ff"/>
      <stop offset=".38" stop-color="#22c4f5"/>
      <stop offset=".7" stop-color="#7fd1a8"/>
      <stop offset="1" stop-color="#ffb86b"/>
    </linearGradient>
    <radialGradient id="glow" cx=".25" cy=".1" r=".9">
      <stop offset="0" stop-color="#1d3a6e"/>
      <stop offset="1" stop-color="#0c1428"/>
    </radialGradient>
    <mask id="moon">
      <rect width="96" height="96" fill="#fff"/>
      <circle cx="44" cy="23" r="18" fill="#000"/>
    </mask>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="22" fill="url(#glow)"/>
  <rect x="2.75" y="2.75" width="90.5" height="90.5" rx="21.25" fill="none" stroke="url(#g)" stroke-opacity=".55" stroke-width="1.5"/>
  <!-- bulan sabit -->
  <circle cx="31" cy="34" r="20" fill="url(#g)" mask="url(#moon)"/>
  <!-- bintang -->
  <circle cx="72" cy="20" r="2.6" fill="#e8edf7"/>
  <circle cx="82" cy="33" r="1.7" fill="#e8edf7" fill-opacity=".8"/>
  <circle cx="62" cy="31" r="1.4" fill="#e8edf7" fill-opacity=".6"/>
  <!-- </> -->
  <g fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M48 59l-9 9 9 9"/>
    <path d="M72 59l9 9-9 9"/>
    <path d="M64 55l-8 26"/>
  </g>
</svg>
